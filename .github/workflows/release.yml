name: Build and Release Wheels

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
          - name: windows
            runner: windows-latest
            platform: windows
          - name: macos
            runner: macos-latest
            platform: macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install zig for Linux manylinux builds
        if: matrix.platform == 'linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Build wheels (Linux)
        if: matrix.platform == 'linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --manifest-path crates/fast_h2m_py/Cargo.toml --release --strip --out dist --zig --interpreter python3.9 --features extension-module,asm-tl

      - name: Build wheels (Windows/macOS)
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --manifest-path crates/fast_h2m_py/Cargo.toml --release --strip --out dist --features extension-module,asm-tl

      - name: Verify wheels are abi3
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No wheels were built in dist/" >&2
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            name="$(basename "$wheel")"
            if [[ "$name" != *abi3* ]]; then
              echo "Expected abi3 wheel, got: $name" >&2
              exit 1
            fi
          done

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl

      - name: Upload wheels to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path crates/fast_h2m_py/Cargo.toml --out dist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

      - name: Upload sdist to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-pypy-wheels:
    name: Build PyPy ${{ matrix.python-version }} wheel on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        target: [linux-x86_64, linux-arm64, windows, macos]
        include:
          - target: linux-x86_64
            name: linux-x86_64
            runner: ubuntu-latest
            platform: linux
            build-args: --manifest-path crates/fast_h2m_py/Cargo.toml --release --locked --strip --out dist --interpreter python --no-default-features --features extension-module,asm-tl --zig --compatibility manylinux_2_28
          - target: linux-arm64
            name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            build-args: --manifest-path crates/fast_h2m_py/Cargo.toml --release --locked --strip --out dist --interpreter python --no-default-features --features extension-module,asm-tl --zig --compatibility manylinux_2_28
          - target: windows
            name: windows
            runner: windows-latest
            platform: windows
            build-args: --manifest-path crates/fast_h2m_py/Cargo.toml --release --locked --strip --out dist --interpreter python --no-default-features --features extension-module,asm-tl
          - target: macos
            name: macos
            runner: macos-latest
            platform: macos
            build-args: --manifest-path crates/fast_h2m_py/Cargo.toml --release --locked --strip --out dist --interpreter python --no-default-features --features extension-module,asm-tl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PyPy
        uses: actions/setup-python@v6
        with:
          # Pin the release so PyPy 3.12 is available before runner caches update.
          python-version: pypy${{ matrix.python-version }}-v8.0.0

      - name: Install zig for Linux manylinux builds
        if: matrix.platform == 'linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Build PyPy wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # The manylinux images do not yet contain PyPy 3.12, so use the
          # interpreter installed above. Zig supplies the portable Linux ABI.
          container: off
          args: ${{ matrix.build-args }}

      - name: Verify PyPy wheel tag
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "Expected exactly one PyPy wheel, found ${#wheels[@]}" >&2
            exit 1
          fi

          expected_tag="pp${{ matrix.python-version }}"
          expected_tag="${expected_tag/./}"
          name="$(basename "${wheels[0]}")"
          if [[ "$name" != *"-${expected_tag}-"* ]]; then
            echo "Expected a ${expected_tag} wheel, got: $name" >&2
            exit 1
          fi

      - name: Smoke-test PyPy wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import os, platform, sys, tempfile; os.chdir(tempfile.gettempdir()); import fast_h2m; assert platform.python_implementation() == 'PyPy'; assert f'{sys.version_info.major}.{sys.version_info.minor}' == '${{ matrix.python-version }}'; assert fast_h2m.__version__"

      - name: Upload PyPy wheel as artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pypy-${{ matrix.python-version }}-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload PyPy wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-pypy-wheels, build-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/fast-h2m
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "sdist"
          merge-multiple: true

      - name: List files to upload
        run: ls -lah dist/

      - name: Validate distributions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))

          if len(wheels) != 12:
              raise SystemExit(f"Expected 12 platform wheels, found {len(wheels)}")
          if len(sdists) != 1:
              raise SystemExit(f"Expected 1 source distribution, found {len(sdists)}")

          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  archive.testzip()

          with tarfile.open(sdists[0], mode="r:gz") as archive:
              archive.getmembers()

          pypy_wheels = [
              wheel for wheel in wheels
              if "-pp311-" in wheel.name or "-pp312-" in wheel.name
          ]
          if len(pypy_wheels) != 8:
              raise SystemExit(f"Expected 8 PyPy wheels, found {len(pypy_wheels)}")

          print(f"Validated {len(wheels)} wheels and {len(sdists)} source distribution")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
