[workspace]
resolver = "2"
members = [
    "crates/fast_h2m",
    "crates/fast_h2m_py",
]

[workspace.package]
version = "0.4.5"
edition = "2024"
authors = ["Na'aman Hirschfeld <naaman@kreuzberg.dev>", "Yehor Smoliakov <egorsmkv@gmail.com>"]
description = "High-performance HTML to Markdown converter"
license = "MIT"
repository = "https://github.com/RustedBytes/fast_h2m"
homepage = "https://github.com/RustedBytes/fast_h2m"
documentation = "https://docs.rs/fast_h2m"
readme = "README.md"
keywords = ["html", "markdown", "converter"]
categories = ["text-processing", "web-programming"]
rust-version = "1.95"

[workspace.dependencies]
asm_tl = "0.2.0"
base64 = "0.23"
html5ever = "0.39.0"
mdream = "1.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rustedbytes-tl = { version = "0.2.0", features = ["std"] }
pyo3 = "0.29.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
debug = 1

[patch.crates-io]
fast_h2m = { path = "crates/fast_h2m", version = "0.4.5" }
# PyPy 3.12 changed its C-extension symbol mapping. Pin PyO3's upstream
# compatibility patch until it is included in a crates.io release.
# https://github.com/PyO3/pyo3/pull/6448
pyo3-build-config = { git = "https://github.com/PyO3/pyo3", rev = "dd54cd6e129439ab2c5d98ff11f06f1e0ea85cd6" }
pyo3-ffi = { git = "https://github.com/PyO3/pyo3", rev = "dd54cd6e129439ab2c5d98ff11f06f1e0ea85cd6" }
